
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baby Feed Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <h1>Baby Feed Tracker</h1>
      <div class="theme-controls">
        <select id="themeSelect" aria-label="Color theme">
          <option value="rose">Rose</option>
          <option value="mint">Mint</option>
          <option value="sky">Sky</option>
        </select>
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark/light">🌙</button>
      </div>
    </header>

    <main>
      <section class="date-nav">
        <button id="prevDay" aria-label="Previous day">◀</button>
        <div class="date-summary">
          <div id="currentDate" class="current-date"></div>
          <div id="dayTotal" class="day-total"></div>
        </div>
        <button id="nextDay" aria-label="Next day">▶</button>
      </section>

      <section class="notes-section">
        <label for="dayNotes">Notes</label>
        <textarea id="dayNotes" rows="3" placeholder="Write notes for this day..."></textarea>
      </section>

      <section class="entries-section">
        <h2>Feed entries</h2>
        <div id="entriesContainer"></div>
        <button id="addEntryBtn" class="primary">Add feed entry</button>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
